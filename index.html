
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Telemetry USMLE medical education and board exam preparation.">
<title>Telemetry USMLE | Telemetry MedLogic</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #26134f;
  background: #f5efff;
}

header {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding: 24px 5%;
  background: rgba(255,255,255,.90);
}

.brand {
  color: #44227e;
  font-size: 24px;
  font-weight: 800;
  text-decoration: none;
}

nav {
  display: flex;
  gap: 26px;
}

nav a {
  color: #321a5d;
  text-decoration: none;
  font-weight: 700;
}

nav a:hover {
  color: #8653cb;
}

.medical-background {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(2, 1fr);
}

.medical-background img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  min-height: 0;
}

.hero {
  position: relative;
  min-height: calc(100vh - 85px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  isolation: isolate;
}

.medical-background {
  z-index: -2;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(
      180deg,
      rgba(237,222,255,.15) 0%,
      rgba(245,238,255,.80) 44%,
      rgba(250,246,255,.97) 80%
    );
}

.hero-content {
  width: min(850px, 100%);
  padding: 48px 34px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,.73);
  box-shadow: 0 20px 70px rgba(49,24,95,.12);
  backdrop-filter: blur(12px);
}

.eyebrow {
  font-size: 14px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #7040b1;
  font-weight: 800;
}

h1 {
  margin: 18px 0;
  font-size: clamp(44px, 7vw, 88px);
  line-height: 1.1;
  letter-spacing: -.04em;
}

.tagline {
  font-size: clamp(21px, 3vw, 32px);
  font-weight: 700;
  line-height: 1.4;
}

.description {
  font-size: 18px;
  color: #5d5271;
}

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 30px;
}

.btn {
  padding: 14px 28px;
  border-radius: 14px;
  font-weight: 700;
  text-decoration: none;
}

.primary {
  background: #6936ac;
  color: white;
}

.secondary {
  background: white;
  color: #6936ac;
  border: 1px solid #6936ac;
}

footer {
  text-align: center;
  padding: 22px;
  background: #eee4fa;
  color: #594777;
}

footer a {
  color: #6936ac;
}

@media (max-width: 700px) {
  header {
    flex-direction: column;
    padding: 18px;
  }

  nav {
    gap: 20px;
  }

  .medical-background {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }

  .hero {
    min-height: 850px;
    padding: 40px 16px;
  }

  .hero-content {
    padding: 32px 20px;
  }

  .description {
    font-size: 16px;
  }
}
</style>
</head>

<body>
<header>
  <a class="brand" href="index.html">✦ Telemetry USMLE</a>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy</a>
  </nav>
</header>

<main>
<section class="hero">

  <div class="medical-background" aria-hidden="true">
    <img src="medical-hero.webp" alt="">
    <img src="robotic-surgery.png" alt="">
    <img src="ecg-telemetry.png" alt="">
    <img src="ct-mri-imaging.png" alt="">
    <img src="doctor-clinical-care.png" alt="">
    <img src="interventional-radiology.png" alt="">
    <img src="emergency-ambulance.png" alt="">
    <img src="vascular-banner.webp" alt="">
  </div>

  <div class="hero-content">
    <div class="eyebrow">Telemetry MedLogic</div>

    <h1>Telemetry USMLE</h1>

    <p class="tagline">
      Medical knowledge. Clinical reasoning.<br>
      The future of medicine.
    </p>

    <p class="description">
      A modern medical education application
      for USMLE preparation.
    </p>

    <div class="actions">
      <a class="btn primary" href="support.html">
        Learn More
      </a>

      <a class="btn secondary"
         href="mailto:telemetrymedlogic@gmail.com">
        Contact Support
      </a>
    </div>
  </div>

</section>
</main>

<footer>
  © 2026 Telemetry USMLE ·
  <a href="support.html">Support</a> ·
  <a href="privacy.html">Privacy Policy</a>
</footer>

</body>
</html>
