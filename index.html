
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Telemetry USMLE medical education and board exam preparation.">
  <title>Telemetry USMLE | Telemetry MedLogic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #26134f;
      background: #f5efff;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 24px 5%;
      background: rgba(255,255,255,0.93);
    }

    .brand {
      color: #44227e;
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 26px;
    }

    nav a {
      color: #321a5d;
      text-decoration: none;
      font-weight: 700;
    }

    nav a:hover {
      color: #8653cb;
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 85px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      isolation: isolate;
      overflow: hidden;
    }

    .medical-background {
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("medical-hero.webp");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        180deg,
        rgba(245,238,255,0.12) 0%,
        rgba(245,238,255,0.25) 55%,
        rgba(245,238,255,0.55) 100%
      );
    }

    .hero-content {
      width: min(820px, 100%);
      padding: 48px 34px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255,255,255,0.80);
      box-shadow: 0 20px 70px rgba(49,24,95,0.15);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7040b1;
      font-weight: 800;
    }

    h1 {
      margin: 18px 0;
      font-size: clamp(44px, 7vw, 82px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .tagline {
      font-size: clamp(21px, 3vw, 30px);
      font-weight: 700;
      line-height: 1.4;
    }

    .description {
      font-size: 18px;
      color: #5d5271;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      background: #6936ac;
      color: white;
    }

    .secondary {
      background: white;
      color: #6936ac;
      border: 1px solid #6936ac;
    }

    .btn:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      padding: 22px;
      background: #eee4fa;
      color: #594777;
    }

    footer a {
      color: #6936ac;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        padding: 18px;
      }

      nav {
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero {
        min-height: 750px;
        padding: 40px 16px;
      }

      .medical-background {
        background-position: center center;
      }

      .hero-content {
        padding: 32px 20px;
      }

      .description {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">✦ Telemetry USMLE</a>

    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
    </nav>
  </header>

  <main>
    <section class="hero">

      <div class="medical-background" aria-hidden="true"></div>

      <div class="hero-content">
        <div class="eyebrow">Telemetry MedLogic</div>

        <h1>Telemetry USMLE</h1>

        <p class="tagline">
          Medical knowledge. Clinical reasoning.<br>
          The future of medicine.
        </p>

        <p class="description">
          A modern medical education application
          for USMLE preparation.
        </p>

        <div class="actions">
          <a class="btn primary" href="support.html">
            Learn More
          </a>

          <a class="btn secondary"
             href="mailto:telemetrymedlogic@gmail.com">
            Contact Support
          </a>
        </div>
      </div>

    </section>
  </main>

  <footer>
    © 2026 Telemetry USMLE ·
    <a href="support.html">Support</a> ·
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
